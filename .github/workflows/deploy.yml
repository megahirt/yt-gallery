name: Fetch videos and deploy to GitHub Pages

# One workflow does everything, so videos.json always ships with the site
# (same origin, no cross-origin fetch, no artifact handoff between workflows).
#
# - schedule / manual: refresh the video data, rebuild the latest v* release
# - push of a v* tag:  release new gallery code (with fresh videos.json)

on:
  schedule:
    - cron: "0 4 * * *" # daily at 04:00 UTC
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write # keepalive step re-enables this workflow

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # need tags to find the latest release

      - name: Check out the release to build
        id: release
        # Tag pushes build that tag. Scheduled/manual runs build the newest
        # v* tag, so unreleased commits on main never go live.
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
          else
            tag="$(git tag -l 'v*' --sort=-v:refname | head -n 1)"
          fi
          if [ -z "$tag" ]; then
            echo "No v* tag found to build" >&2
            exit 1
          fi
          git checkout --detach "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@v8.0.0

      - name: Write credentials from secrets
        # Single quotes around the secret prevent the shell from interpreting
        # JSON special characters (braces, quotes, etc.)
        working-directory: fetch
        run: |
          echo '${{ secrets.YOUTUBE_TOKEN_JSON }}' > token.json
          echo '${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}' > client_secret.json

      - name: Check out the private catalog
        # Metadata YouTube has no field for (site, people, places, ...) lives
        # in the private yt-gallery-catalog repo, read with a read-only deploy
        # key. If this fails, the fetch step fails too (REQUIRE_CATALOG) and
        # the run falls back to the live videos.json.
        continue-on-error: true
        uses: actions/checkout@v6
        with:
          repository: megahirt/yt-gallery-catalog
          ssh-key: ${{ secrets.CATALOG_DEPLOY_KEY }}
          path: fetch/catalog

      - name: Fetch videos
        id: fetch
        continue-on-error: true # fall back to the live copy below
        working-directory: fetch
        env:
          REQUIRE_CATALOG: "1"
        run: |
          uv run fetch_videos.py
          uv run make_simple_video_list.py

      - uses: actions/configure-pages@v6
        id: pages

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gallery/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: gallery

      # Every site (family at /, the others under their path) is built into
      # gallery/build-sites and deployed as one Pages site.
      - name: Build all sites
        if: steps.fetch.outcome == 'success'
        run: npm run build:sites
        working-directory: gallery
        env:
          PUBLIC_BUILD_VERSION: ${{ steps.release.outputs.tag }}

      - name: Build all sites from the currently deployed data
        if: steps.fetch.outcome == 'failure'
        run: npm run build:sites -- --from-live "${{ steps.pages.outputs.base_url }}"
        working-directory: gallery
        env:
          PUBLIC_BUILD_VERSION: ${{ steps.release.outputs.tag }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: gallery/build-sites

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Keep the schedule alive
        # GitHub disables scheduled workflows after 60 days without repo
        # activity; re-enabling the workflow resets that timer.
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Fail the run if the YouTube fetch failed
        # The site was still deployed with the previous data; failing here
        # makes GitHub send the failure email (usually an expired OAuth token:
        # run `uv run login.py` and update the YOUTUBE_TOKEN_JSON secret; or
        # the catalog checkout failed: check the CATALOG_DEPLOY_KEY secret).
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::YouTube fetch or catalog checkout failed; site redeployed with previous videos.json"
          exit 1
